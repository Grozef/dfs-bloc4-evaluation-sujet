<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName eval-dfs-p-tpl-20265-06.it-students.fr
    DocumentRoot /var/www/opstrack/public

    <Directory /var/www/opstrack/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ProxyPreserveHost On
    ProxyPass /dispatch-dashboard http://127.0.0.1:3000/
    ProxyPassReverse /dispatch-dashboard http://127.0.0.1:3000/
    ProxyPass /_next/ http://127.0.0.1:3000/_next/
    ProxyPassReverse /_next/ http://127.0.0.1:3000/_next/

    ErrorLog ${APACHE_LOG_DIR}/opstrack_error.log
    CustomLog ${APACHE_LOG_DIR}/opstrack_access.log combined

SSLCertificateFile /etc/letsencrypt/live/eval-dfs-p-tpl-20265-06.it-students.fr/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/eval-dfs-p-tpl-20265-06.it-students.fr/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
